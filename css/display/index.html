<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>CSS Display</h1>

    <h2>1. Block</h2>
    <div class="block-box">Box 1</div>
    <div class="block-box">Box 2</div>


    <h2>2. Inline</h2>
    <div class="inline-box">Box 1</div>
    <div class="inline-box">Box 2</div>


    <h2>3. Inline Block</h2>
    <div class="inline-block-box">Box 1</div>
    <div class="inline-block-box">Box 2</div>

    <h2>4. None</h2>
    <div class="none">Box</div>


    <h2>5. Flex</h2>
    <div class="parent">
        <div class="item">One</div>
        <div class="item">two</div>
        <div class="item">three</div>
        <div class="item">four</div>
        <div class="item">five</div>

    </div>

</body>
</html>
