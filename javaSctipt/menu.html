<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile menu</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
      }

      nav {
        width: 100%;
        background-color: #333;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 15px 30px;
      }

      .logo {
        font-size: 24px;
        color: #fff;
      }

      .menu {
        display: none;
        font-size: 30px;
        color: #fff;
        cursor: pointer;
      }

      ul {
        list-style: none;
        display: flex;
        gap: 20px;
      }

      ul li {
        display: flex;
        gap: 20px;
      }

      ul li a {
        color: #fff;
        font-size: 18px;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        nav {
          display: flex;
          justify-content: space-around;
          align-items: center;
          padding: 15px 30px;
        }

        .menu {
          display: block;
        }

        ul {
          display: none;
        }

        ul.show {
          display: flex;
          flex-direction: column;
          position: absolute;
          top: 60px;
          left: 0;
          width: 100%;
          background-color: #333;
          padding: 20px;
        }

        ul li {
          flex-direction: column;
          gap: 15px;
        }

        ul li a {
          border-bottom: 1px solid #fff;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="menu">=</div>
      <div class="logo">Logo</div>

      <ul>
        <li><a href="#">About</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <script>
      const menu = document.querySelector(".menu");
      const links = document.querySelector("ul");

      menu.addEventListener("click", function () {
        links.classList.toggle("show");

        if (links.classList.contains("show")) {
          menu.textContent = "x";
        } else {
          menu.textContent = "=";
        }
      });
    </script>
  </body>
</html>
